[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simulacra"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "numpy-quaternion>=2024.0.12",
    "pydantic>=2.12.3",
    "scipy>=1.16.3",
]

[tool.hatchling.build.targets.wheel]
packages = ["src/simulacra"]
