[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simulacra"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "cvxpy>=1.8.1",
    "matplotlib>=3.10.7",
    "numpy>=2.3.4",
    "pydantic>=2.12.3",
    "rich>=14.3.3",
    "scipy>=1.16.3",
    "setuptools>=70.0,<81",
    "tensorboard>=2.20.0",
    "tqdm>=4.67.3",
    "websockets>=16.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatchling.build.targets.wheel]
packages = ["src/simulacra"]

[project.optional-dependencies]
rl = [
    "gymnasium>=1.0.0",
]
sb3 = [
    "stable-baselines3>=2.7.1",
]
jax = [
    "jax[cpu]>=0.6.0",
    "flax>=0.10.0",
    "optax>=0.2.0",
]
jax-gpu = [
    "jax[cuda12]>=0.6.0",
    "flax>=0.10.0",
    "optax>=0.2.0",
]
neat = [
    "tensorneat @ git+https://github.com/EMI-Group/tensorneat.git",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "pytest>=9.0.1",
    "scipy-stubs>=1.16.3.2",
]
