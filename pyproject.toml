[project]
name = "simulacra"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ooj" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "pillow>=11.3.0",
    "unyt>=3.0.4",
]

[project.scripts]
simulacra = "simulacra:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=25.9.0",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "ruff>=0.13.2",
]
